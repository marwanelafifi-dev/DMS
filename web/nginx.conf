server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's bundled mime.types has no entry for .mjs (a newer extension), so it
    # falls back to application/octet-stream. Browsers enforce strict MIME
    # checking for ES module scripts, so pdf.js's module worker (pdf.worker.min.mjs)
    # silently fails to load with the wrong type — this serves it correctly.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the .NET service on the internal Docker network
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        # Allow large file uploads
        client_max_body_size 100M;
    }

    # Same-origin gateway to the private OCR/LibreOffice service. The trailing
    # slash strips the public /ocr prefix before forwarding, e.g.
    # /ocr/api/documents/convert -> /api/documents/convert.
    location /ocr/ {
        # Index deletion is an internal API-to-OCR operation used by permanent
        # Recycle Bin purge. Do not expose destructive OCR methods through the
        # browser-facing gateway.
        limit_except GET POST {
            deny all;
        }

        proxy_pass http://ocr-rag:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        client_max_body_size 100M;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
